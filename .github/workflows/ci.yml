name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Ruff lint (trade_desk)
        run: ruff check trade_desk/app/ trade_desk/modules/ --select E,F,W --ignore E501

      - name: Ruff lint (trade_ml)
        run: ruff check trade_ml/ --select E,F,W --ignore E501

  syntax-check:
    name: Syntax check (no heavy deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check all Python files parse
        run: |
          find trade_desk/app trade_desk/modules -name "*.py" | xargs python -m py_compile
          echo "All files compile OK"

  unit-tests:
    name: Unit tests (pure logic, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest pandas yfinance scipy joblib finta

      - name: Run tests
        working-directory: trade_desk
        run: pytest tests/ -v

  unit-tests-ml:
    name: Unit tests — trade_ml (pure logic, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest pandas numpy scipy xgboost yfinance finta

      - name: Run tests
        working-directory: trade_ml
        run: pytest tests/test_return_model_units.py -v
